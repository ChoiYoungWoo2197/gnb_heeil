services:
  gnb_heeil:
    build: .
    container_name: gnb_heeil
    ports:
      - "8082:80"
    environment:
      - DB_NAME=gnb_heeil
      - DB_USER=gnb_heeil
      - DB_PASS=gnb_heeil
    volumes:
      - .:/var/www/html
      - ./data:/var/www/html/data
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
